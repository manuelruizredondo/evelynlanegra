[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Todo /interno/ pasa antes por la puerta: sin contraseña no se sirve ni el HTML
[[edge_functions]]
  path = "/interno"
  function = "interno"

[[edge_functions]]
  path = "/interno/*"
  function = "interno"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
